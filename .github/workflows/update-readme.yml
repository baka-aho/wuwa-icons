name: Auto Update Character Grid

on:
  push:
    paths:
      - "characters/**"
      - "weapons/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run grid generator script
        run: python grid.py

      - name: Commit and push if README changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff-index --quiet HEAD || (git commit -m "docs: auto-update character icon grid" && git push)
